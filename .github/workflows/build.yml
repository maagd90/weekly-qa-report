name: Build

on:
  push:
    branches:
      - main
      - 'check/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quiet Git messages
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install dependencies
        run: npm ci --silent

      - name: Build batch workspace
        run: |
          npm run build --workspace=apps/batch > /tmp/batch-build.log 2>&1 || {
            summary=$(tail -n 40 /tmp/batch-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-3500)
            echo "::error title=Batch build failed::$summary"
            exit 1
          }

      - name: Build api workspace
        run: npm run build --workspace=apps/api

      - name: Build web workspace
        run: npm run build --workspace=apps/web
