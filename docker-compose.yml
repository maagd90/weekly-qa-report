version: "3.9"

services:
  dashboard-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3001
      - INPUT_DIR=/data/input
      - OUTPUT_DIR=/data/output
      - CONFIG_DIR=/data/config
    volumes:
      - ./input:/data/input
      - ./output:/data/output
      - ./config:/data/config
    ports:
      - "3001:3001"

  dashboard-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - dashboard-api
