<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Vendor Portal Bugs phase and environment mockup</title>
  <desc id="desc">Desktop and mobile layouts showing Phase 1 UAT, Phase 2 UAT, Production, source files, separate UAT, Production, and Unclassified detail tabs, and pagination.</desc>
  <rect width="1440" height="900" fill="#edeae2"/>
  <style>
    .serif{font-family:Georgia,serif;fill:#202423}.sans{font-family:Arial,sans-serif;fill:#202423}.mono{font-family:monospace;fill:#656b69}.muted{fill:#777d7a}.tiny{font-size:10px}.small{font-size:12px}.body{font-size:14px}.h2{font-size:25px;font-weight:700}.h3{font-size:16px;font-weight:700}.count{font-size:25px;font-weight:700}.card{fill:#fff;stroke:#d8d4c9}.soft{fill:#faf8f2;stroke:#e8e4da}.line{stroke:#202423;stroke-width:2}.barbg{fill:#e9e6de}.phase1{fill:#6e89a6}.phase2{fill:#2f6f7a}.prod{fill:#c24533}.warn{fill:#fbf6e9;stroke:#b5822f}.pill{fill:#fff;stroke:#d8d4c9}.active{fill:#202423}.white{fill:#fff}
  </style>

  <text x="40" y="45" class="serif h2">Implemented display mockup</text>
  <text x="40" y="67" class="sans small muted">Desktop and phone layouts use the same data: two files merge, then Subject prefixes separate the rows.</text>

  <!-- Desktop -->
  <rect x="40" y="92" width="930" height="760" rx="4" fill="#f5f3ed" stroke="#cfcabd"/>
  <rect x="40" y="92" width="930" height="48" fill="#202423"/>
  <text x="64" y="122" class="mono small white">QA REPORTING · VENDOR PORTAL BUGS</text>
  <text x="64" y="183" class="serif h2">Vendor Portal Bugs</text>
  <text x="64" y="204" class="sans small muted">Daily ODL and production exports are merged, then separated by Subject prefix.</text>

  <!-- Desktop KPIs -->
  <g transform="translate(64 230)">
    <rect width="200" height="82" class="card"/><text x="16" y="23" class="mono tiny">TOTAL BUGS</text><text x="16" y="57" class="serif count">74</text><text x="58" y="57" class="sans tiny muted">in scope</text>
    <rect x="216" width="200" height="82" class="card"/><text x="232" y="23" class="mono tiny">OPEN</text><text x="232" y="57" class="serif count">31</text>
    <rect x="432" width="200" height="82" class="card"/><text x="448" y="23" class="mono tiny">CLOSED</text><text x="448" y="57" class="serif count">43</text>
    <rect x="648" width="194" height="82" class="card"/><text x="664" y="23" class="mono tiny">URGENT OPEN</text><text x="664" y="57" class="serif count prod">4</text>
  </g>

  <!-- Desktop phase chart -->
  <g transform="translate(64 334)">
    <rect width="842" height="278" class="card"/>
    <text x="18" y="28" class="serif h3">Bug Distribution by Environment &amp; Phase</text>
    <text x="18" y="47" class="sans tiny muted">UAT → Phase 1 · Phase 2B UAT → Phase 2 · INC → Production</text>
    <rect x="596" y="15" width="112" height="24" class="pill"/><text x="606" y="31" class="mono tiny">daily-odl.xlsx · 54</text>
    <rect x="714" y="15" width="111" height="24" class="pill"/><text x="724" y="31" class="mono tiny">production.xlsx · 20</text>

    <text x="18" y="88" class="sans small" font-weight="700">Phase 1 UAT</text><rect x="118" y="76" width="34" height="17" class="phase1"/><text x="127" y="88" class="mono tiny white">UAT</text>
    <rect x="190" y="79" width="440" height="13" class="barbg"/><rect x="190" y="79" width="440" height="13" class="phase1"/><text x="650" y="90" class="mono body">32 · 43%</text><text x="736" y="89" class="mono tiny muted">10 open · 22 closed</text>

    <text x="18" y="133" class="sans small" font-weight="700">Phase 2 UAT</text><rect x="118" y="121" width="34" height="17" class="phase2"/><text x="127" y="133" class="mono tiny white">UAT</text>
    <rect x="190" y="124" width="440" height="13" class="barbg"/><rect x="190" y="124" width="302" height="13" class="phase2"/><text x="650" y="135" class="mono body">22 · 30%</text><text x="736" y="134" class="mono tiny muted">8 open · 14 closed</text>

    <text x="18" y="178" class="sans small" font-weight="700">Production</text><rect x="118" y="166" width="39" height="17" class="prod"/><text x="125" y="178" class="mono tiny white">PROD</text>
    <rect x="190" y="169" width="440" height="13" class="barbg"/><rect x="190" y="169" width="220" height="13" class="prod"/><text x="650" y="180" class="mono body">16 · 22%</text><text x="736" y="179" class="mono tiny muted">11 open · 5 closed</text>

    <rect x="18" y="208" width="806" height="48" class="warn"/><text x="32" y="230" class="sans small" font-weight="700">4 unclassified</text><text x="32" y="246" class="sans tiny muted">Visible for naming cleanup; not silently added to another phase.</text><text x="710" y="238" class="mono tiny">VIEW 4 BUGS →</text>
  </g>

  <!-- Desktop filters/table -->
  <g transform="translate(64 634)">
    <rect width="842" height="190" class="card"/>
    <text x="18" y="30" class="serif h3">Vendor Portal Bugs — Production bugs</text><text x="18" y="48" class="sans tiny muted">16 rows · newest submissions first</text>
    <rect x="432" y="15" width="98" height="24" class="pill"/><text x="442" y="31" class="mono tiny">UAT BUGS · 54</text>
    <rect x="536" y="15" width="126" height="24" class="active"/><text x="546" y="31" class="mono tiny white">PRODUCTION BUGS · 16</text>
    <rect x="668" y="15" width="108" height="24" class="pill"/><text x="678" y="31" class="mono tiny">UNCLASSIFIED · 4</text>
    <text x="782" y="31" class="mono tiny muted">1–10 · 1/2 ›</text>
    <line x1="0" y1="62" x2="842" y2="62" class="line"/>
    <text x="18" y="82" class="mono tiny">TICKET</text><text x="112" y="82" class="mono tiny">SUBJECT</text><text x="462" y="82" class="mono tiny">STATUS</text><text x="570" y="82" class="mono tiny">PHASE / ENV</text><text x="720" y="82" class="mono tiny">SUBMITTED</text>
    <line x1="0" y1="92" x2="842" y2="92" stroke="#eeeae1"/>
    <text x="18" y="115" class="mono small phase2">INC-1042</text><text x="112" y="115" class="sans small">INC001042 Checkout unavailable</text><text x="462" y="115" class="sans small">Open</text><text x="570" y="115" class="mono tiny prod">PRODUCTION</text><text x="720" y="115" class="mono tiny">2026-07-14</text>
    <line x1="0" y1="128" x2="842" y2="128" stroke="#eeeae1"/>
    <text x="18" y="151" class="mono small phase2">INC-1043</text><text x="112" y="151" class="sans small">INC001043 Booking confirmation delay</text><text x="462" y="151" class="sans small">Closed</text><text x="570" y="151" class="mono tiny prod">PRODUCTION</text><text x="720" y="151" class="mono tiny">2026-07-15</text>
  </g>

  <!-- Mobile -->
  <rect x="1010" y="92" width="390" height="760" rx="12" fill="#f5f3ed" stroke="#cfcabd"/>
  <rect x="1010" y="92" width="390" height="45" rx="12" fill="#202423"/><rect x="1010" y="125" width="390" height="12" fill="#202423"/>
  <text x="1030" y="120" class="mono tiny white">VENDOR PORTAL BUGS</text>
  <text x="1030" y="176" class="serif h2">Vendor Portal Bugs</text>
  <text x="1030" y="197" class="sans tiny muted">74 bugs · 31 open</text>
  <g transform="translate(1030 218)">
    <rect width="170" height="68" class="card"/><text x="12" y="21" class="mono tiny">TOTAL</text><text x="12" y="51" class="serif count">74</text>
    <rect x="180" width="170" height="68" class="card"/><text x="192" y="21" class="mono tiny">OPEN</text><text x="192" y="51" class="serif count">31</text>
  </g>
  <g transform="translate(1030 302)">
    <rect width="350" height="333" class="card"/>
    <text x="14" y="28" class="serif h3">Bug Distribution by Environment &amp; Phase</text>
    <text x="14" y="49" class="sans tiny muted">2 source files in scope</text>
    <text x="14" y="81" class="sans small" font-weight="700">Phase 1 UAT</text><rect x="297" y="67" width="38" height="18" class="phase1"/><text x="306" y="80" class="mono tiny white">UAT</text>
    <rect x="14" y="94" width="322" height="13" class="phase1"/><text x="14" y="124" class="mono small">32 · 43%</text><text x="222" y="124" class="mono tiny muted">10 open · 22 closed</text>
    <text x="14" y="158" class="sans small" font-weight="700">Phase 2 UAT</text><rect x="297" y="144" width="38" height="18" class="phase2"/><text x="306" y="157" class="mono tiny white">UAT</text>
    <rect x="14" y="171" width="322" height="13" class="barbg"/><rect x="14" y="171" width="221" height="13" class="phase2"/><text x="14" y="201" class="mono small">22 · 30%</text><text x="228" y="201" class="mono tiny muted">8 open · 14 closed</text>
    <text x="14" y="235" class="sans small" font-weight="700">Production</text><rect x="293" y="221" width="43" height="18" class="prod"/><text x="299" y="234" class="mono tiny white">PROD</text>
    <rect x="14" y="248" width="322" height="13" class="barbg"/><rect x="14" y="248" width="161" height="13" class="prod"/><text x="14" y="278" class="mono small">16 · 22%</text><text x="222" y="278" class="mono tiny muted">11 open · 5 closed</text>
    <rect x="14" y="293" width="322" height="26" class="warn"/><text x="25" y="310" class="sans tiny">4 unclassified subjects · VIEW BUGS →</text>
  </g>
  <g transform="translate(1030 651)">
    <rect width="350" height="173" class="card"/>
    <text x="14" y="25" class="serif h3">Separate bug detail tabs</text>
    <rect x="14" y="40" width="91" height="24" class="pill"/><text x="24" y="56" class="mono tiny">UAT BUGS · 54</text>
    <rect x="111" y="40" width="119" height="24" class="active"/><text x="121" y="56" class="mono tiny white">PRODUCTION · 16</text>
    <rect x="236" y="40" width="100" height="24" class="pill"/><text x="246" y="56" class="mono tiny">OTHER · 4</text>
    <text x="14" y="86" class="mono tiny muted">1–10 of 16 · Page 1 of 2 · PREVIOUS · NEXT</text>
    <line x1="14" y1="110" x2="336" y2="110" stroke="#ded9ce"/>
    <text x="14" y="131" class="mono tiny phase2">INC-1042</text><text x="91" y="131" class="sans tiny">Checkout unavailable</text><text x="272" y="131" class="mono tiny prod">PROD</text>
    <text x="14" y="154" class="sans tiny muted">Detail table scrolls horizontally when needed.</text>
  </g>
</svg>
